    <style>
        :root {
            --primary-gold: #D4AF37;
            --light-gold: #FFF8E7;
            --dark-gold: #B8860B;
            --white: #FFFFFF;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-color: #FDFBF7;
            --success: #27ae60;
            --error: #e74c3c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Header Styling */
        header {
            background: linear-gradient(135deg, #D4AF37 0%, #FFDF00 100%);
            color: var(--white);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 15px;
            color: #FFF8E7;
            font-weight: 300;
        }

        .student-name-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .student-name-container input {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            width: 250px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            color: var(--text-dark);
        }

        /* Container Styling */
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Card Styling */
        .exam-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.08);
            border: 1px solid #F0E6D2;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .exam-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }

        .exam-card h3 {
            margin-top: 0;
            color: var(--dark-gold);
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid var(--light-gold);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .exam-card h3::before {
            content: '★';
            color: var(--primary-gold);
            margin-right: 10px;
            font-size: 20px;
        }

        /* Image Styling */
        .image-wrapper {
            text-align: center;
            margin-bottom: 20px;
            background: var(--light-gold);
            padding: 10px;
            border-radius: 10px;
            border: 2px dashed var(--primary-gold);
            position: relative;
            overflow: hidden;
        }

        .exam-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Input Styling */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dark);
        }

        .input-group input[type="text"], 
        .input-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .input-group input[type="text"]:focus, 
        .input-group textarea:focus {
            border-color: var(--primary-gold);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            outline: none;
        }

        .input-group textarea {
            height: 80px;
            resize: vertical;
        }

        /* Feedback Styling */
        .feedback {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .feedback.correct {
            color: var(--success);
            background-color: #E8F8F5;
            display: block;
        }

        .feedback.incorrect {
            color: var(--error);
            background-color: #FDEDEC;
            display: block;
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin: 50px 0;
        }

        .submit-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #E6C200 0%, #D4AF37 100%);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Score Board */
        .score-board {
            display: none;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFFFFF 100%);
            border: 2px solid var(--primary-gold);
            color: var(--dark-gold);
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            font-size: 22px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .score-board span {
            color: var(--success);
            font-size: 28px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 22px; }
            .exam-card { padding: 15px; }
            .submit-btn { width: 100%; padding: 15px; }
        }
    </style>
</head>

        const container = document.getElementById('exam-container');
        
        examData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'exam-card';
            
            let html = `<h3>Question Set ${item.id}</h3>`;
            
            // ပုံအတွက် Placeholder ဖန်တီးခြင်း (ရွှေရောင်နှင့် အဖြူရောင်)
            // user မှာ ပုံမရှိသေးတာကြောင့် ခေါင်းစဉ်နှင့် သက်ဆိုင်သော စာသားဖြင့် ပုံဖန်တီးပေးထားသည်
            const placeholderText = encodeURIComponent(item.title);
            const imgUrl = `https://placehold.co/600x350/FFF8E7/D4AF37?text=${placeholderText}&font=poppins`;
            
            html += `
                <div class="image-wrapper">
                    <img src="${imgUrl}" alt="${item.title}" class="exam-image">
                </div>
            `;
            
            item.questions.forEach((q) => {
                html += `
                    <div class="input-group">
                        <label>${q.label}</label>
                        <textarea class="student-answer" data-answer="${q.answer}" placeholder="Enter your answer here..."></textarea>
                        <div class="feedback"></div>
                    </div>
                `;
            });
            
            card.innerHTML = html;
            container.appendChild(card);
        });

        // အဖြေစစ်ဆေးခြင်း (Auto Check Logic)
        function submitExam() {
            const studentName = document.getElementById('studentName').value.trim() || 'Student';
            const answers = document.querySelectorAll('.student-answer');
            let score = 0;
            let total = answers.length;

            answers.forEach(input => {
                const studentAnswer = input.value.trim().toLowerCase();
                const correctAnswer = input.getAttribute('data-answer').trim().toLowerCase();
                const feedbackDiv = input.nextElementSibling;

                // အဖြေစစ်ခြင်း (အသေးစိတ်စာလုံးပေါင်းအတိုင်း စစ်သည်)
                if (studentAnswer === correctAnswer) {
                    score++;
                    input.style.borderColor = 'var(--success)';
                    feedbackDiv.textContent = 'Correct!';
                    feedbackDiv.className = 'feedback correct';
                } else {
                    input.style.borderColor = 'var(--error)';
                    feedbackDiv.textContent = `Incorrect. Correct answer: ${input.getAttribute('data-answer')}`;
                    feedbackDiv.className = 'feedback incorrect';
                }
            });

            // Score Board ကို ပြသခြင်း
            const scoreBoard = document.getElementById('score-board');
            document.getElementById('score').textContent = score;
            document.getElementById('total').textContent = total;
            scoreBoard.style.display = 'block';
            
            // Score Board ထဲမှာ ကလေးနာမည် ထည့်ခြင်း
            scoreBoard.innerHTML = `<strong>${studentName}</strong>, Your Score: <span>${score}</span> / <span>${total}</span>`;

            // အပေါ်ကို ပြန်တင်ခြင်း
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            alert(`Exam Submitted!\nStudent: ${studentName}\nScore: ${score} / ${total}`);
        }
    </script>
